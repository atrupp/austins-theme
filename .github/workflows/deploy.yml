name: Deploy Theme to Bluehost (SFTP)
on:
  push:
    branches:
      - master
jobs:
  deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🚀 Deploy to Bluehost
      uses: easingthemes/ssh-deploy@v5.1.0
      with:
        SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.BLUEHOST_SERVER }}
        REMOTE_USER: ${{ secrets.BLUEHOST_USERNAME }}
        SOURCE: "./"
        TARGET: "/home2/izsuvemy/public_html/wp-content/themes/austins-theme/"
        SSH_CMD_ARGS: "-o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o IdentityAgent=none"
