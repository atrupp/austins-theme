name: Deploy Theme to Bluehost (SFTP)

on:
  push:
    branches:
      - main # Change to master if your primary branch is master

jobs:
  deploy:
    name: 🎉 SFTP Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 🚀 SFTP Deploy to Bluehost Theme Folder
      uses: wlixcc/SFTP-Deploy-Action@v1.2.6
      with:
        username: ${{ secrets.BLUEHOST_USERNAME }}
        server: ${{ secrets.BLUEHOST_SERVER }}
        ssh_private_key: ${{ secrets.BLUEHOST_SSH_KEY }}
        # Port is 22 for secure SSH connections
        port: 22 
        # Update 'your-theme-folder' to match your actual theme folder name on Bluehost
        remote_path: '/home/your_bluehost_username/public_html/wp-content/themes/your-theme-folder'
