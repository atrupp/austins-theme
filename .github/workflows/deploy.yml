name: Deploy Theme to Bluehost (SFTP)

on:
  push:
    branches:
      - master # Triggered automatically whenever you push to master

jobs:
  deploy:
    name: 🎉 SFTP Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 🚀 SFTP Deploy to Bluehost Theme Folder
      uses: wlixcc/SFTP-Deploy-Action@v1.2.6
      with:
        username: ${{ secrets.BLUEHOST_USERNAME }}
        server: ${{ secrets.BLUEHOST_SERVER }}
        ssh_private_key: ${{ secrets.BLUEHOST_SSH_KEY }}
        port: 22 
        # UPDATE 'atrupp-theme' to your actual theme folder name on Bluehost
        remote_path: '/home/atrupp/public_html/wp-content/themes/atrupp-theme'
